name: forecast

# Hourly refresh of public/data/latest.json, public/api/today.json, AND
# public/index.html. Runs `gleam run` to fetch NDBC + NOAA + Open-Meteo,
# writes the combined JSON and the terse today digest, and SSRs the wave-
# layer paths into index.html via wave_spec.render_path.
# Commits any change back to main as `dawnpass-bot`. Vercel auto-deploys
# on push.
#
# Loop prevention:
#   - no `on: push` trigger here, so bot's own commits can't re-fire this
#   - ci.yml has paths-ignore for public/** so bot commits don't run CI
#   - concurrency group serializes runs; if one tick is slow the next queues

on:
  schedule:
    # Twice per hour at off-peak minutes. GitHub's scheduler skips runs
    # during top-of-hour congestion (their docs); :23 and :53 dodge the
    # herd, and the second tick rescues hours where the first slips. Free
    # — identical-data ticks no-op via `git diff --cached --quiet` below.
    - cron: '23,53 * * * *'
  workflow_dispatch:           # manual trigger button in GH Actions UI

permissions:
  contents: write              # bot needs to push public/data/ commits

concurrency:
  # Shared with version.yml so cron and human-push bumps never push
  # concurrently — they queue on the same lane.
  group: refresh-or-version
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Start timer
        id: timer
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN_ACTION }}
          # Need full history so SITE_VERSION can find the most recent
          # non-`refresh:` commit. Default fetch-depth: 1 would only see
          # the bot's own latest refresh commit.
          fetch-depth: 0

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.5'
          gleam-version: '1.16.0'

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: |
            build
            ~/.cache/gleam
          key: ${{ runner.os }}-gleam-${{ hashFiles('manifest.toml') }}
          restore-keys: ${{ runner.os }}-gleam-

      - run: gleam deps download
      - run: gleam build

      # Date of the last non-`refresh:` commit — i.e. the last meaningful
      # source change. Substituted into the footer via {{SITE_VERSION}}.
      # Falls back to "dev" only if no matching commit is found, which
      # would mean the entire repo history is bot-only (impossible here).
      - name: Compute SITE_VERSION
        run: |
          v=$(git log --grep='^refresh:' --invert-grep --format='%cs' -1)
          echo "SITE_VERSION=${v:-dev}" >> "$GITHUB_ENV"
          echo "computed SITE_VERSION=${v:-dev}"

      - run: gleam run

      - name: Commit refresh
        id: commit
        run: |
          git config user.name 'dawnpass-bot'
          git config user.email 'bot@brickellresearch.org'
          mkdir -p public/data public/api
          git add public/data public/api public/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "committed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "committed=1" >> "$GITHUB_OUTPUT"
          git commit -m "refresh: $(date -u +%FT%H:%MZ)"
          # Race-safe push: a human commit can land between checkout and push,
          # which makes the bot's main non-fast-forward and the push fails.
          # Rebase our refresh commit onto the new remote and retry. The bot
          # only touches public/data, public/api, and public/index.html, so
          # conflicts are implausible — but if a rebase ever fails, abort and
          # surface it.
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt — rebasing onto remote"
            git pull --rebase --autostash origin main || { git rebase --abort; exit 1; }
          done
          echo "Failed to push refresh after 3 attempts"
          exit 1

      # Always emit metrics, even on failure — otherwise the only runs we see
      # in Datadog are successful ones, and a stalled cron looks identical to
      # "no recent data". DD_API_KEY is a repo secret; if it's missing the step
      # no-ops so this workflow keeps working without DD configured.
      - name: Push metrics to Datadog
        if: always()
        env:
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          if [ -z "$DD_API_KEY" ]; then
            echo "DD_API_KEY not set; skipping Datadog push."
            exit 0
          fi
          now=$(date +%s)
          duration=$(( now - ${{ steps.timer.outputs.start }} ))
          status='${{ job.status }}'
          committed='${{ steps.commit.outputs.committed }}'
          # Outcomes: committed (success + pushed), noop (success, no changes),
          # failure (any step failed), cancelled (manual / timeout).
          case "$status" in
            success) [ "$committed" = "1" ] && outcome=committed || outcome=noop ;;
            failure) outcome=failure ;;
            cancelled) outcome=cancelled ;;
            *) outcome="$status" ;;
          esac
          echo "metrics: duration=${duration}s outcome=${outcome} committed=${committed:-0}"
          # v2/series payload. type 1 = count, 3 = gauge. Count metrics need
          # `interval` (seconds) so DD knows the rate window — 1800 matches the
          # 30-min cron cadence.
          payload=$(cat <<JSON
          {"series":[
            {"metric":"dawnpass.refresh.duration_seconds","type":3,
             "points":[{"timestamp":${now},"value":${duration}}],
             "tags":["service:dawnpass","workflow:forecast","outcome:${outcome}"]},
            {"metric":"dawnpass.refresh.run","type":1,"interval":1800,
             "points":[{"timestamp":${now},"value":1}],
             "tags":["service:dawnpass","workflow:forecast","outcome:${outcome}"]},
            {"metric":"dawnpass.refresh.committed","type":3,
             "points":[{"timestamp":${now},"value":${committed:-0}}],
             "tags":["service:dawnpass","workflow:forecast"]}
          ]}
          JSON
          )
          curl -sS --fail-with-body -X POST \
            "https://api.datadoghq.com/api/v2/series" \
            -H "Content-Type: application/json" \
            -H "DD-API-KEY: $DD_API_KEY" \
            -d "$payload"
