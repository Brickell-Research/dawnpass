name = "dawnpass"
version = "0.1.0"
target = "erlang"

description = "Surf forecast for the Pinellas Gulf longboard breaks. A Brickell Research project."

# Fill in once the GitHub remote is set up.
# repository = { type = "github", user = "...", repo = "dawnpass" }

links = [
  { title = "Brickell Research", href = "https://brickellresearch.org" },
]

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gleam_json = ">= 2.0.0 and < 4.0.0"
simplifile = ">= 2.0.0 and < 3.0.0"
filepath = ">= 1.0.0 and < 2.0.0"
envoy = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
birdie = ">= 2.0.0 and < 3.0.0"
