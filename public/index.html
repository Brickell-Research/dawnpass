<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dawnpass · Brickell Research</title>
  <meta name="description" content="Surf forecast for the Pinellas Gulf longboard breaks. A Brickell Research project.">
  <meta name="color-scheme" content="dark">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <meta property="og:type" content="website">
  <meta property="og:title" content="dawnpass">
  <meta property="og:description" content="Surf forecast for the Pinellas Gulf longboard breaks.">
  <meta property="og:url" content="https://dawnpass.brickellresearch.org/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/wave.js" defer></script>
</head>
<body>
  <main>
    <h1>dawnpass</h1>
    <p class="tagline">the watch is up.</p>

    <section class="now" aria-label="current conditions">
      <header class="now-header">
        <h2 class="now-title">now</h2>
        <span class="now-meta">
          <span class="now-source" id="now-source">—</span>
          <span class="stale-pill" id="stale-pill" hidden>stale</span>
        </span>
      </header>

      <div class="now-grid">
        <div class="metric">
          <span class="metric-label">wave</span>
          <span class="metric-value" id="m-wave">—</span>
        </div>
        <div class="metric">
          <span class="metric-label">period</span>
          <span class="metric-value" id="m-period">—</span>
        </div>
        <div class="metric">
          <span class="metric-label">wind</span>
          <span class="metric-value" id="m-wind">—</span>
        </div>
      </div>

      <div class="tide-row">
        <span class="tide-label">tide</span>
        <span class="tide-value" id="m-tide">—</span>
      </div>

      <ul class="wave-legend" aria-label="wave layer legend">
        <li class="legend-item legend-swell">swell</li>
        <li class="legend-item legend-mean">mean</li>
        <li class="legend-item legend-chop">chop</li>
      </ul>

      <svg class="now-wave" viewBox="0 0 800 100" preserveAspectRatio="none" aria-hidden="true">
        <path id="wave-chop"  d="" fill="none" stroke-linecap="round"/>
        <path id="wave-mean"  d="" fill="none" stroke-linecap="round"/>
        <path id="wave-swell" d="" fill="none" stroke-linecap="round"/>
      </svg>

      <p class="now-updated" id="now-updated">awaiting data…</p>
    </section>

    <p class="status">v0 · pre-release · forecast logic en route</p>
  </main>

  <footer>
    <p>A <a href="https://brickellresearch.org">Brickell Research</a> project.</p>
  </footer>
</body>
</html>
